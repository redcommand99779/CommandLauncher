name: Bug report
description: Report a problem with Command Launcher
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: launcher-version
    attributes:
      label: Launcher version
      description: Shown in Settings > About
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version and loader
      placeholder: "1.21.1 Fabric"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Crash log or screenshots
      description: Paste the crash log (Profiles > Crash viewer) or drag in screenshots. Do not post tokens or passwords.
      render: shell
    validations:
      required: false
  - type: input
    id: discord-ticket
    attributes:
      label: Discord ticket (optional)
      placeholder: "ticket-0001"
    validations:
      required: false
