<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Log</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0f1117;
    color: #e8eaf0;
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #titlebar {
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 600;
    border-bottom: 0.5px solid #1e2235;
    flex-shrink: 0;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .line { margin-bottom: 3px; }
  .info { color: #7d879e; }
  .success { color: #28c840; }
  .error { color: #c84040; }
  #log:empty::before {
    content: 'Waiting for log...';
    color: #4a5a7a;
  }
</style>
</head>
<body>
  <div id="titlebar">Log</div>
  <div id="log"></div>
  <script>
    const logEl = document.getElementById('log');
    const titleEl = document.getElementById('titlebar');

    window.logAPI.onLine(({ message, type }) => {
      const div = document.createElement('div');
      div.className = 'line ' + (type || 'info');
      div.textContent = message;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    });

    window.logAPI.onTitle(title => {
      titleEl.textContent = title;
      document.title = title;
    });

    window.logAPI.onClear(() => { logEl.innerHTML = ''; });
  </script>
</body>
</html>
